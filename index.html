<style>

aside{width:232px;background:var(--ink);color:#cfe3df;padding:20px 14px;position:sticky;top:0;height:100vh;flex-shrink:0}

nav button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;color:inherit;font:inherit;padding:10px 12px;border-radius:10px;cursor:pointer;margin-bottom:2px}
nav button:hover{background:var(--ink2)}nav button.on{background:var(--ac);color:#fff;font-weight:600}
main{flex:1;min-width:0;padding:28px 32px 60px;max-width:1100px}
h1{font-size:24px;margin:0 0 4px}.lead{color:var(--mu);margin:0 0 18px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:12px 14px}.stat b{font-size:22px;display:block}.stat span{color:var(--mu);font-size:12px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
input[type=search],select,textarea{font:inherit;border:1px solid var(--ln);border-radius:10px;padding:9px 12px;background:#fff;color:var(--tx)}
input[type=search]{flex:1;min-width:200px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px;align-items:center}.chips small{color:var(--mu);margin-right:2px}
.chip{border:1px solid var(--ln);background:#fff;border-radius:99px;padding:4px 11px;font-size:12.5px;cursor:pointer}.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:16px 18px;margin-bottom:10px}
.card h3{margin:0 0 4px;font-size:15px}.meta{color:var(--mu);font-size:12.5px}
.b{display:inline-block;border-radius:6px;padding:2px 8px;font-size:11.5px;font-weight:600;margin-right:4px;background:#eef2f1;color:var(--mu)}
.b.Berlaku{background:#DDF3EA;color:var(--ok)}.b.Dicabut{background:#F7E1DE;color:var(--no)}.b.Draft{background:#FBEFD5;color:var(--dr)}.b.Diubah{background:#DEEAF7;color:var(--ch)}.b.Cek{background:#EBE3F5;color:var(--ck)}
.rel{background:var(--ac2);border-radius:10px;padding:9px 12px;margin-top:8px;font-size:13px}
.act{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
a.btn,button.btn{background:var(--ac);color:#fff;border:0;border-radius:9px;padding:7px 13px;font:600 13px inherit;font-family:inherit;text-decoration:none;cursor:pointer}
a.btn.g,button.btn.g{background:#fff;color:var(--ac);border:1px solid var(--ac)}
details{border:1px solid var(--ln);border-radius:14px;background:#fff;margin-bottom:10px}
summary{padding:14px 18px;cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:10px}
summary::after{content:'+';color:var(--ac);font-size:18px}details[open] summary::after{content:'\2212'}
.in{padding:0 18px 16px}.in h4{margin:12px 0 4px;font-size:13px;color:var(--ac)}.in ul{margin:0;padding-left:18px}
.src{display:inline-block;background:var(--ac2);color:var(--ac);border-radius:6px;padding:1px 8px;font-size:12px;margin:2px 3px 0 0;cursor:pointer;border:0;font-family:inherit}
.steps{position:relative;margin:6px 0 0 8px;border-left:2px solid var(--ln);padding-left:20px}
.step{position:relative;margin-bottom:14px}.step::before{content:attr(data-n);position:absolute;left:-33px;top:0;width:24px;height:24px;border-radius:50%;background:var(--ac);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center}
.warn{border-left:4px solid var(--dr);background:#FFF9EC}
.note{font-size:12px;color:var(--mu);margin-top:18px}
textarea{width:100%;min-height:140px;font-family:ui-monospace,monospace;font-size:12px}
.empty{text-align:center;color:var(--mu);padding:30px}
@media(max-width:760px){body{flex-direction:column}aside{width:100%;height:auto;position:static;padding:12px}nav{display:flex;overflow-x:auto;gap:4px}nav button{white-space:nowrap;width:auto}.sub{display:none}main{padding:18px 14px 50px}}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
@media print{aside,.bar,.act{display:none}main{padding:0}}

document.addEventListener('click',async e=>{
const ks=e.target.closest('[data-ksel]');if(ks){S.kas.sel[ks.dataset.ksel]=!S.kas.sel[ks.dataset.ksel];S.kas.manual=true;render();return}
const ka=e.target.closest('[data-kak]');if(ka){const v=ka.dataset.kak,a=S.kas.ak;S.kas.ak=a.includes(v)?a.filter(x=>x!==v):[...a,v];render();return}
const k=e.target.closest('[data-kas]');if(k){const a=k.dataset.kas;
if(a==='jalan'){if(!S.kas.manual&&(S.kas.uraian||'').trim()&&!Object.keys(S.kas.sel).length){terapkanDeteksi();render()}S.kas.jalan=true;runKas();const h=$('#hasil');h&&h.scrollIntoView&&h.scrollIntoView({behavior:'smooth'})}
else if(a==='reset'){S.kas={judul:'',uraian:'',pr:'',ak:[],ob:'',st:'berlaku',ins:'',th:'',jalan:false,cek:{},open:{},bukti:{},dokt:'',belum:false,sel:{},alasan:[],manual:false};render()}
else if(a==='unduh')unduhBerkas('\ufeff'+laporanKas(),'laporan-analisis-kasus.md','text/markdown');
else if(a==='unduhdoc')unduhBerkas('\ufeff'+laporanHtml(),'laporan-analisis-kasus.doc','application/msword');
else if(a==='cetak')cetakLaporan();
else if(a==='simpan'){const i=$('#kinfo');try{const nm='laporan-'+(S.kas.judul||'kasus').replace(/[^\w]+/g,'-').slice(0,40)+'-'+new Date().toISOString().slice(0,10)+'.html';const r=await apiJ('api/dokumen/unggah',{nama:nm,folder:'Analisis Kasus',b64:b64Teks(laporanHtml())});i.textContent=r.ok?'Tersimpan di folder Analisis Kasus ('+nm+').':(r.pesan||'Gagal menyimpan.');await muatDok()}catch(x){i.textContent='Gagal menyimpan.'}}
return}
if(e.target.closest('#kdet')){const d=terapkanDeteksi();render();const m=$('#kmsg');if(m)m.textContent=(d.pr||d.ak.length||Object.keys(d.sel).length)?`Terdeteksi: produk=${d.prs.map(p=>LBL[p]).join(', ')||'-'}, aktivitas=${d.ak.map(a=>LBL[a]).join(', ')||'-'}, ${Object.keys(d.sel).length} persyaratan dipilih (lihat Dasar deteksi). Ubah dengan mengklik chip, lalu tekan Analisis.`:'Tidak ada kata kunci fasilitas, produk, atau aktivitas yang terdeteksi. Pilih chip secara manual.';return}
const f=e.target.closest('[data-dkf]');if(f){S.df=f.dataset.dkf;render();return}
const d=e.target.closest('[data-dk]');if(!d)return;const a=d.dataset.dk;
if(a==='hapus'){if(confirm('Hapus dokumen ini dari folder?')){await apiJ('api/dokumen/hapus',{id:d.dataset.id});await muatDok();render()}}
else if(a==='jadikan'){const x=DOKS.dokumen.find(y=>y.id===d.dataset.id);if(!x)return;const nm=x.nama.replace(/\.[^.]+$/,'');const e=[{id:'dok-'+x.id,k:'(isi nama singkat, mis. PerBPOM 1/2027)',j:'Peraturan',t:nm,ins:'',st:'Cek',tg:'',ob:'U',pr:[],ak:[],r:'Dari dokumen '+x.nama+(x.tak_dikenal&&x.tak_dikenal.length?'. Menyebut peraturan yang belum ada di database: '+x.tak_dikenal.join(', '):''),pdf:x.berkas,v:0}];const t=$('#imp');if(t){t.value=JSON.stringify(e,null,1);t.scrollIntoView&&t.scrollIntoView({behavior:'smooth',block:'center'});const m=$('#msg');if(m)m.textContent='Templat dibuat dari dokumen. Lengkapi kolom k, ins, st, pr, ak, lalu tekan Simpan ke korpus.'}}
else if(a==='cari'){const q=($('#dq')||{}).value||'';const r=await (await fetch('api/dokumen/cari?q='+encodeURIComponent(q))).json();S.dh=r.hasil;render()}
else if(a==='unggah'){const fi=$('#dfile'),m=$('#dmsg');if(!fi.files.length){m.textContent='Pilih berkas dulu.';return}
let fol=$('#dfol').value;if(fol==='__baru')fol=($('#dfolb').value||'').trim()||'Umum';let ok=0,baru=0,gagal=[];
for(const f of fi.files){m.textContent='Mengunggah '+f.name+'...';try{const r=await apiJ('api/dokumen/unggah',{nama:f.name,folder:fol,b64:await fileB64(f),reg_id:$('#dreg').value||null});if(r.ok){ok++;if(r.dokumen&&r.dokumen.reg_baru)baru++}else gagal.push(f.name+': '+(r.pesan||'gagal'))}catch(x){gagal.push(f.name)}}
await muatData();S.dh=null;render();const mm=$('#dmsg');if(mm)mm.textContent=ok+' berkas terunggah.'+(baru?' '+baru+' peraturan baru dibuat otomatis di korpus dan ditautkan ke persyaratan terkait (lihat menu Peraturan).':'')+(gagal.length?' Gagal: '+gagal.join('; '):'')}});

const V={dok:vDok,kas:vKas,reg:vReg,fas:vFas,prd:vPrd,peta:vPeta};
function render(){nav();$('#m').innerHTML=V[S.tab]();bind();}
function bind(){
const q=$('#q');if(q)q.oninput=e=>{S.q=e.target.value;const p=e.target.selectionStart;render();const n=$('#q');n.focus();n.setSelectionRange(p,p)};
const f=$('#fq');if(f)f.oninput=e=>{S.fq=e.target.value;const p=e.target.selectionStart;render();const n=$('#fq');n.focus();n.setSelectionRange(p,p)};
const cv=$('#csv');if(cv)cv.onclick=()=>{const rows=[['Nomor','Judul','Status','Instansi','Tautan PDF']].concat(REG.map(r=>[r.k,r.t,r.st,r.ins,r.pdf||searchUrl(r)]));const l=document.createElement('a');l.href=URL.createObjectURL(new Blob(['\ufeff'+rows.map(x=>x.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n')],{type:'text/csv'}));l.download='daftar-peraturan.csv';l.click()};
const dp=$('#dp');if(dp)dp.ontoggle=()=>{S.po=dp.open};
const sy=$('#sync');if(sy)sy.onclick=async()=>{sy.disabled=true;$('#pmsg').textContent='Menyinkronkan, harap tunggu...';try{const d=await api('api/sinkron');$('#pmsg').textContent=d.pesan||'Selesai';await muatData()}catch(e){$('#pmsg').textContent='Gagal menghubungi server lokal.'}};
const a=$('#add');if(a){a.onclick=async()=>{const m=$('#msg');try{const d=JSON.parse($('#imp').value);if(!Array.isArray(d))throw 0;if(d.some(e=>!e.k||String(e.k).startsWith('(isi')||!e.t)){m.textContent='Lengkapi kolom k (nama singkat) dan t (judul) dahulu.';return}
if(API){const r=await api('api/korpus/tambah',{regulasi:d});await muatData();const m2=$('#msg');if(m2)m2.textContent=r.pesan||'Disimpan.'}
else{const x=JSON.parse(localStorage.getItem('regulens_extra')||'[]').concat(d);localStorage.setItem('regulens_extra',JSON.stringify(x));let n=0;d.forEach(e=>{e.pr=e.pr||[];e.ak=e.ak||[];if(!e.id)e.id=String(e.k).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');REG.push(e);n+=tautkanBaru(e)});m.textContent=d.length+' peraturan ditambahkan dan ditautkan ke '+n+' persyaratan. Tersimpan di browser ini saja; jalankan python app.py agar tersimpan permanen di data/korpus.json.'}}catch(e){m.textContent='Format JSON tidak valid atau penyimpanan gagal.'}};
$('#exp').onclick=()=>{const l=document.createElement('a');l.href=URL.createObjectURL(new Blob([JSON.stringify(REG,null,1)],{type:'application/json'}));l.download='korpus-regulens.json';l.click()};
$('#clr').onclick=()=>{try{localStorage.removeItem('regulens_extra');$('#msg').textContent='Data tambahan dihapus. Muat ulang halaman.'}catch(e){}}}}
document.addEventListener('click',e=>{const t=e.target.closest('[data-t],[data-f],[data-go],[data-ac]');if(!t)return;
if(t.dataset.ac==='korpus/hapus'&&!confirm('Hapus peraturan ini dari database beserta tautannya di persyaratan?'))return;
if(t.dataset.ac){api('api/'+t.dataset.ac,{jenis:t.dataset.kind,id:t.dataset.id}).then(()=>muatData());return}
if(t.dataset.t){S.tab=t.dataset.t;S.fq='';S.fk='';S.fa=''}
else if(t.dataset.f){S[t.dataset.f]=t.dataset.v}
else if(t.dataset.go){const r=byId(t.dataset.go);S.tab='reg';S.q=r.k;S.st='';S.ob='';S.pr='';S.ak=''}
render();if(t.dataset.go)scrollTo(0,0)});
render();muatData();
</script></body></html>
